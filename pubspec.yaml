name: chronosport
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  


flutter_icons:
  android: true
  ios: true
  image_path: "assets/splash/splash.png"



flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.mp3
    - assets/sounds/final_beep.mp3
    - assets/splash/splash.png


flutter_native_splash:
  color: "#000000"
  image: assets/splash/splash.png
  android: true
  ios: true
  fullscreen: true
